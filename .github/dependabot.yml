version: 2
updates:
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    groups:
      android-dependencies:
        patterns: ["*"]
    labels: [dependencies, android]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-research-dependencies:
        patterns: ["*"]
    labels: [dependencies, research]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    labels: [dependencies, ci]
