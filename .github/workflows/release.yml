name: Signed Android release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Validate tag and release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -Fq "versionName = \"$version\"" android/app/build.gradle.kts
          test -f "RELEASE_NOTES_${GITHUB_REF_NAME}.md"
      - name: Restore release signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > android/release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RELEASE_STORE_PASSWORD" "$RELEASE_KEY_ALIAS" "$RELEASE_KEY_PASSWORD" \
            > android/keystore.properties
      - name: Test, lint, and build signed artifacts
        working-directory: android
        run: ./gradlew --no-daemon clean testDebugUnitTest lintRelease assembleRelease bundleRelease
      - name: Verify and checksum release artifacts
        run: |
          mkdir dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/Pehredar-${GITHUB_REF_NAME}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "dist/Pehredar-${GITHUB_REF_NAME}.aab"
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose --print-certs "dist/Pehredar-${GITHUB_REF_NAME}.apk"
          sha256sum dist/*.apk dist/*.aab > dist/SHA256SUMS.txt
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
      - name: Preserve workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag $prerelease \
            --title "Pehredar ${GITHUB_REF_NAME}" \
            --notes-file "RELEASE_NOTES_${GITHUB_REF_NAME}.md"
