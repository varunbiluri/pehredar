name: Android checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@c8a326d85724fce2ae59a38810306f4a058f26a4 # v6
      - run: chmod +x gradlew
      - name: Check all 22 localizations
        working-directory: .
        run: python3 scripts/check_localizations.py
      - name: Check repository policies and links
        working-directory: .
        run: python3 scripts/check_repository.py
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease
