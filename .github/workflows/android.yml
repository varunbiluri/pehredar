name: Android checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
      - run: chmod +x gradlew
      - name: Check all 22 localizations
        working-directory: .
        run: python3 scripts/check_localizations.py
      - name: Check repository policies and links
        working-directory: .
        run: python3 scripts/check_repository.py
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease
