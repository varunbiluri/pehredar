name: Android checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
      - run: chmod +x gradlew
      - name: Check all 22 localizations
        working-directory: .
        run: python3 scripts/check_localizations.py
      - name: Check repository policies and links
        working-directory: .
        run: python3 scripts/check_repository.py
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease
