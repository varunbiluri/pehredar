[project]
name = "pehredar"
version = "0.1.0"
description = "Private on-device unknown-caller screening for Android, localized for Indian languages"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2.1",
    "huggingface-hub>=0.23.2,<1.0",
    "llama-cpp-python>=0.3.34",
    "piper-tts>=1.6.1",
    # Runtime translation leg (LLM output -> caller's language). Pinned to
    # 4.44.2: IndicTrans2's custom modeling/tokenizer code (2023, unmaintained)
    # breaks on transformers 5.x internals (tokenizer __init__ ordering,
    # dropped transformers.onnx module). See finetune/ for why this conflicts
    # with the newer transformers the (now-parked) Gemma fine-tuning used.
    "torch>=2.13.0",
    "transformers==4.44.2",
    "indictranstoolkit>=1.1.1",
    "sentencepiece>=0.2.2",
]

[dependency-groups]
# Historical: used for the (concluded, see README "Model research") Gemma 3
# 270M LoRA fine-tuning experiments. trl/peft here need whatever transformers
# version they resolve to given the ==4.44.2 pin above (required for the
# IndicTrans2 translation leg) -- likely too old for Gemma 3 support, so
# these scripts aren't expected to be re-run against this lockfile as-is.
finetune = [
    "accelerate",
    "gguf>=0.19.0",
    "peft",
    "protobuf>=7.35.1",
    "trl",
]
